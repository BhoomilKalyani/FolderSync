name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FolderSync.sln

      - name: Build
        run: dotnet build FolderSync.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FolderSync.Tests/FolderSync.Tests.csproj -c Release --no-build --verbosity normal
