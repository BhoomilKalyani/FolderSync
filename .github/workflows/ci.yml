name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderSync.sln

      - name: Build
        run: dotnet build FolderSync.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FolderSync.Tests/FolderSync.Tests.csproj -c Release --no-build --verbosity normal
