name: Release

# Push a version tag and this builds the installer and publishes the release, so existing
# installs see the update:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0)'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
                 '${{ github.event.inputs.version }}'
               } else {
                 '${{ github.ref_name }}' -replace '^v',''
               }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not major.minor.patch" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      # Fail the release rather than shipping a broken build.
      - name: Test
        run: dotnet test tests/FolderSync.Tests/FolderSync.Tests.csproj -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Publish the release with the installer attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $tag     = '${{ steps.ver.outputs.tag }}'
          $setup   = "dist\FolderSyncSetup-$version.exe"
          $sumFile = "$setup.sha256"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }
          if (-not (Test-Path $sumFile)) { throw "Checksum not found: $sumFile" }

          # The app will only install an update whose installer matches this checksum.
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $published = ((Get-Content -LiteralPath $sumFile -Raw).Trim() -split '\s+')[0]
          if ($published -ne $hash) { throw "Checksum file says $published but the installer is $hash" }

          # Build the notes as a file to avoid quoting/indentation pitfalls.
          $notes = @(
            "## Folder Sync $version",
            "",
            "Download **FolderSyncSetup-$version.exe** below and run it.",
            "Installs per-user with no admin rights; the .NET runtime is bundled.",
            "",
            "Existing installations will offer this update automatically, and check the installer",
            "against its checksum before running it.",
            "",
            "SHA-256: ``$hash``"
          )
          Set-Content -Path notes.md -Value $notes -Encoding utf8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sumFile --clobber
          } else {
            gh release create $tag $setup $sumFile --title "Folder Sync $version" --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }

          # Read the release back as the app will, so a release the app would refuse to install fails here.
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $leaf = Split-Path $setup -Leaf
          $asset = $release.assets | Where-Object name -eq $leaf
          if (-not $asset) { throw "The release has no $leaf asset" }
          if (-not ($release.assets | Where-Object name -eq "$leaf.sha256")) { throw "The release has no $leaf.sha256 asset" }
          if ($asset.digest -and $asset.digest -ne "sha256:$hash") { throw "GitHub reports $($asset.digest) for $leaf, expected sha256:$hash" }
          Write-Host "Published $leaf with SHA-256 $hash"
