name: Release

# Push a version tag and this builds the installer and publishes the release, so existing
# installs see the update:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0)'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
                 '${{ github.event.inputs.version }}'
               } else {
                 '${{ github.ref_name }}' -replace '^v',''
               }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not major.minor.patch" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      # Fail the release rather than shipping a broken build.
      - name: Test
        run: dotnet test tests/FolderSync.Tests/FolderSync.Tests.csproj -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Publish the release with the installer attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $tag     = '${{ steps.ver.outputs.tag }}'
          $setup   = "dist\FolderSyncSetup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }

          # Build the notes as a file to avoid quoting/indentation pitfalls.
          $notes = @(
            "## Folder Sync $version",
            "",
            "Download **FolderSyncSetup-$version.exe** below and run it.",
            "Installs per-user with no admin rights; the .NET runtime is bundled.",
            "",
            "Existing installations will offer this update automatically."
          )
          Set-Content -Path notes.md -Value $notes -Encoding utf8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "Folder Sync $version" --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
